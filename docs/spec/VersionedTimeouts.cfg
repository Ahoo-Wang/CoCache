\* VersionedCache: one timeout or connection replacement (late putIfNewer, evict and FILL, K14 releases, P12).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 1
    Deleted = {}
    MaxTokens = 2
    MaxEvicts = 1
    MaxNoise = 0
    MaxFaults = 1
    Faults = {"timeout", "reconnect"}
    Versioned = TRUE
    Refresh = FALSE
    LaggingLoader = FALSE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK G2L1 G2L2 G2Read NoLostInvalidation G2L2LateFill
PROPERTIES VersionMonotonic
CHECK_DEADLOCK FALSE
