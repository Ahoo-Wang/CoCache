\* F2 (expected to fail): a version-advancing FILL that runs after its reader gave up is filtered on its
\* own node, where a reader that bypassed SingleFlight keeps the older version (README, Findings).
\* Fix decided (2026-11-03): an unknown-outcome versioned FILL bumps the stamp and evicts the local copy;
\* follow-up PR "fix(core): close TLA+ findings F2-F4". Move G2L2LateFill into VersionedTimeouts once it lands.
CONSTANTS
    Nodes = {n1}
    Writers = {n1}
    Rids = {1, 2}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 4
    MaxEvicts = 0
    MaxNoise = 0
    MaxFaults = 1
    Faults = {"reconnect"}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = FALSE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS G2L2LateFill
CHECK_DEADLOCK FALSE
