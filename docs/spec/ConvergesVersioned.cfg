\* VersionedCache: L2 converges to the last commit without relying on L2 expiry; no faults (the model's versioned writer does not replay a write whose outcome is unknown).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 1
    Deleted = {}
    MaxTokens = 2
    MaxEvicts = 1
    MaxNoise = 1
    MaxFaults = 0
    Faults = {}
    Versioned = TRUE
    Refresh = FALSE
    LaggingLoader = FALSE
    L1Expiry = TRUE
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Converges
CHECK_DEADLOCK FALSE
