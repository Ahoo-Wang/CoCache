\* Cache readers with one timeout or connection replacement (no writer): every token is filled or released,
\* except a lease granted by a drained READ after its reader gave up, which lives until lease.ttl (F4, accepted bound).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {}
    Rids = {1}
    MaxVersion = 1
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 1
    MaxFaults = 1
    Faults = {"timeout", "reconnect"}
    Versioned = FALSE
    Refresh = FALSE
    LaggingLoader = FALSE
    L1Expiry = TRUE
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES TokensBounded
CHECK_DEADLOCK FALSE
