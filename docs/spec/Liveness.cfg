\* Cache: tokens are filled or released, and L2 converges to the last commit; one timeout.
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 1
    Deleted = {}
    MaxTokens = 2
    MaxEvicts = 0
    MaxNoise = 0
    MaxFaults = 1
    Faults = {"timeout"}
    Versioned = FALSE
    Refresh = FALSE
    LaggingLoader = FALSE
    L1Expiry = TRUE
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES TokensReleased Converges
CHECK_DEADLOCK FALSE
