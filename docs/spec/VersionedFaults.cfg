\* VersionedCache: one crash, lost or duplicated frame, reset, or loader failure; version 2 is a deletion (tombstones).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {2}
    MaxTokens = 2
    MaxEvicts = 1
    MaxNoise = 1
    MaxFaults = 1
    Faults = {"crash", "loss", "dup", "reset", "loader"}
    Versioned = TRUE
    Refresh = FALSE
    LaggingLoader = FALSE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK G2L1 G2L2 G2Read
PROPERTIES VersionMonotonic
CHECK_DEADLOCK FALSE
