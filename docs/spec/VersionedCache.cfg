\* VersionedCache: putIfNewer, evict (state E), versioned fills and refresh; no faults. NoLostInvalidation is F1 (FindingsLostInvalidation.cfg).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 1
    MaxNoise = 1
    MaxFaults = 0
    Faults = {}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = FALSE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK G2L1 G2L2 G2Read RefreshKeepsNewer
PROPERTIES VersionMonotonic
CHECK_DEADLOCK FALSE
