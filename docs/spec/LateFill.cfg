\* VersionedCache on one node with two readers and one connection replacement: a version-advancing FILL
\* that runs after its reader gave up never leaves an older copy on its own node (TLA+ F2, fixed in #764:
\* an unknown-outcome versioned FILL bumps the stamp and evicts the local copy).
CONSTANTS
    Nodes = {n1}
    Writers = {n1}
    Rids = {1, 2}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 0
    MaxFaults = 1
    Faults = {"reconnect"}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = FALSE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK G2L2LateFill
CHECK_DEADLOCK FALSE
