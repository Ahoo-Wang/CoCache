\* Cache with a loader: invalidate, lease fills, early refresh, L1 and L2 expiry; no faults.
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 2
    MaxFaults = 0
    Faults = {}
    Versioned = FALSE
    Refresh = TRUE
    LaggingLoader = FALSE
    L1Expiry = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK G2L1 G2L2 G2Read NoLostInvalidation
CHECK_DEADLOCK FALSE
