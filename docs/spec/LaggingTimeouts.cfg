\* VersionedCache whose loader may read any committed version, with one timeout: L1 versions never go back
\* (I-K) and neither do L2 copies (TLA+ F3, fixed in #764: compute keeps a newer copy; F2's unknown-outcome rule).
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 2
    MaxEvicts = 0
    MaxNoise = 0
    MaxFaults = 1
    Faults = {"timeout"}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = TRUE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK
PROPERTIES VersionMonotonic L2VersionMonotonic
CHECK_DEADLOCK FALSE
