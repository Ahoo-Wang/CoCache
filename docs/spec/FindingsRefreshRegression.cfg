\* F3 (expected to fail): a refresh whose FILL times out puts an older version into L2 (README, Findings).
\* Fix decided (2026-11-03): a versioned cache's L2 never moves back in version (compute keeps a newer entry);
\* follow-up PR "fix(core): close TLA+ findings F2-F4". Move this config into the CI set once it lands.
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 1
    MaxFaults = 1
    Faults = {"timeout"}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = TRUE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS RefreshKeepsNewer
CHECK_DEADLOCK FALSE
