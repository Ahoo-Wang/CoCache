\* VersionedCache whose loader may read any committed version (a stale replica, outside the protocol):
\* versions in L1 never go back (I-K) and a refresh never puts L2 behind L1 (P2); no faults.
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 2
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 1
    MaxFaults = 0
    Faults = {}
    Versioned = TRUE
    Refresh = TRUE
    LaggingLoader = TRUE
    L1Expiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK RefreshKeepsNewer
PROPERTIES VersionMonotonic
CHECK_DEADLOCK FALSE
