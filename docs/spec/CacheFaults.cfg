\* Cache with refresh: one crash, lost or duplicated frame, reset, or loader failure.
CONSTANTS
    Nodes = {n1, n2}
    Writers = {n1}
    Rids = {1}
    MaxVersion = 1
    Deleted = {}
    MaxTokens = 3
    MaxEvicts = 0
    MaxNoise = 1
    MaxFaults = 1
    Faults = {"crash", "loss", "dup", "reset", "loader"}
    Versioned = FALSE
    Refresh = TRUE
    LaggingLoader = FALSE
    L1Expiry = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK G2L1 G2L2 G2Read NoLostInvalidation
CHECK_DEADLOCK FALSE
