[versions]
# libraries
spring-boot = "4.1.2"
kotlin-logging = "8.0.4"
# cocache-core 的协程核心（RFC 0005 V5）使用。必须等于 Spring Boot 管理的版本（4.0.x 与 4.1.x 都是 1.10.2）：
# 用 Spring 依赖管理的用户运行时拿到的就是它，按更高版本编译的字节码会调用它没有的方法（1.11.0 的 `runBlocking` 编译为 `runBlockingK`，
# 运行时 NoSuchMethodError）。Renovate 不自动升级它（renovate.json），随 Spring Boot 的 BOM 手动升级
kotlinx-coroutines = "1.10.2"
springdoc = "3.1.1"
# testing
junit = "6.1.3"
fluent-assert = "1.2.1"
mockk = "1.14.11"
# 模型检验（RFC 0005 §4.10、Q18：可行性实验之后再决定是否正式加入）
lincheck = "3.7"
# plugins
detekt = "1.23.8"
dokka = "2.2.0"
kotlin = "2.4.21"
publish-plugin = "2.0.0"
jmh-plugin = "0.7.3"
openjdk-jmh = "1.37"
# GraalVM Native Build Tools 插件，只用于 cocache-example 的原生镜像构建；版本由 Renovate 维护
graalvm-native = "1.1.17"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# 确定性多节点仿真的测试调度器与虚拟时间（RFC 0005 §4.10，只用于测试）
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
fluent-assert-bom = { module = "me.ahoo.test:fluent-assert-bom", version.ref = "fluent-assert" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
lincheck = { module = "org.jetbrains.lincheck:lincheck", version.ref = "lincheck" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }

