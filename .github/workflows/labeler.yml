name: Pull Request Labeler
on:
  # pull_request_target 让 fork 的 PR 也能打标签；本工作流不检出、不执行 PR 代码
  pull_request_target:
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: false
