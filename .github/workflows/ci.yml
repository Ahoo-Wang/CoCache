# 主干与 PR 的唯一质量门禁：
# - Static Analysis：actionlint + Detekt（全模块，SARIF 上传 code scanning）+ 许可证头检查
# - Test & Coverage：真实 Redis 下运行全部模块的 check（测试、dokka、JMH 编译、覆盖率门禁），并上传 Codecov
# - Test (JDK 25)：产物仍按 JDK 17 编译，测试运行在最新 LTS 上，验证运行时兼容性
# - Test (Redis Cluster)：Redis 相关模块的测试在 3 主 3 从的 Redis Cluster 上运行（slot 路由、pipeline、Pub/Sub）
name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 内部 PR 才能访问 secrets / 写 code scanning；fork PR 跳过这两步而不是失败
  TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Detekt and license headers
        run: ./gradlew detekt checkLicenseHeader --continue

      - name: Upload Detekt SARIF to code scanning
        if: ${{ always() && env.TRUSTED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merge.sarif
          category: detekt

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Detekt 与许可证头由 Static Analysis 并行执行
      - name: Check (tests, docs, benchmark compile, coverage gate)
        run: ./gradlew check -x detekt -x checkLicenseHeader --continue

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ env.TRUSTED == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
          flags: unittests
          fail_ci_if_error: true

  test-latest-jdk:
    name: Test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (toolchain) and JDK 25 (test runtime)
        uses: actions/setup-java@v6
        with:
          java-version: |
            25
            17
          distribution: 'temurin'
          cache: gradle

      - name: Test on JDK 25
        run: >-
          ./gradlew test --continue
          -PtestJavaVersion=25
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk25
          path: '**/build/reports/tests/'
          retention-days: 7

  test-redis-cluster:
    name: Test (Redis Cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Start Redis Cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
          .github/scripts/start-redis-cluster.sh "$RUNNER_TEMP/redis-cluster"

      # RedisTestSupport 与 starter 测试都读取该变量，改为连接集群
      - name: Test Redis modules on Redis Cluster
        env:
          SPRING_DATA_REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
        run: >-
          ./gradlew --continue
          :cocache-spring-redis:test
          :cocache-spring-cache:test
          :cocache-spring-boot-starter:test

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-redis-cluster
          path: '**/build/reports/tests/'
          retention-days: 7
