# 主干与 PR 的唯一质量门禁：
# - Static Analysis：actionlint + Detekt（全模块，SARIF 上传 code scanning）+ 许可证头检查
# - Test & Coverage：真实 Redis 下运行全部模块的 check（测试、dokka、JMH 编译、覆盖率门禁），并上传 Codecov
name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 内部 PR 才能访问 secrets / 写 code scanning；fork PR 跳过这两步而不是失败
  TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Detekt and license headers
        run: ./gradlew detekt checkLicenseHeader --continue

      - name: Upload Detekt SARIF to code scanning
        if: ${{ always() && env.TRUSTED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merge.sarif
          category: detekt

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Detekt 与许可证头由 Static Analysis 并行执行
      - name: Check (tests, docs, benchmark compile, coverage gate)
        run: ./gradlew check -x detekt -x checkLicenseHeader --continue

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ env.TRUSTED == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
          flags: unittests
          fail_ci_if_error: true
