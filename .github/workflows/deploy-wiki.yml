# PR 中只构建（尽早发现文档构建错误），主干上构建并部署到 GitHub Pages
name: Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - '.github/workflows/deploy-wiki.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: wiki/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: wiki

      - name: Build with VitePress
        run: pnpm build
        working-directory: wiki

      # Mermaid 在浏览器端渲染，构建成功不代表图表语法正确
      - name: Validate Mermaid diagrams
        run: pnpm check:mermaid
        working-directory: wiki

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: wiki/.vitepress/dist

  deploy:
    name: Deploy Wiki
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
