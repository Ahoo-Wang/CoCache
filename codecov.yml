coverage:
  range: 80..100
  round: down
  precision: 2
  status:
    project:
      default:
        # 整体覆盖率不得低于 90%，且单次变更最多下降 1%
        target: 90%
        threshold: 1%
    patch:
      default:
        # 新增/修改代码至少 80% 覆盖
        target: 80%
        threshold: 1%
ignore:
  - "cocache-test/.*"
  - "cocache-example/.*"
